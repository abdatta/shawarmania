<!doctype html>
<!--
  /menu/ — the table menu, the page the QR codes on the tables open.

  Read on a phone at the table, often on patchy Wi-Fi, so the whole menu is in
  this HTML and works with no script at all. The one script (src/menu/spy.ts)
  is an enhancement: it highlights the chip of the section being read. The dishes come from src/data/dinein.json via
  plugins/dinein-menu.ts (edit them at /admin → Table menu, never here); the
  footer facts come from plugins/legal-facts.ts.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#14100B" />
    <title>Menu — Shawarmania</title>
    <meta
      name="description"
      content="The Shawarmania dine-in menu — shawarmas, smashed burgers, sandwiches, appetizers, mains, Arabian favourites, desserts, tea, coffee and mocktails, with prices."
    />
    <link rel="canonical" href="https://shawarmania.in/menu/" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="512x512" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="stylesheet" href="../src/styles/menu.css" />
  </head>
  <body>
    <header class="masthead">
      <a href="%BASE_URL%">
        <img src="../src/assets/brand/logo.png" alt="{{brand.name}} — home" width="226" height="162" />
      </a>
    </header>

    <main>
      <h1>Menu</h1>

      <nav class="chips" aria-label="Menu sections">
        <ul>
          <!-- dinein:nav -->
        </ul>
      </nav>

      <!-- dinein:sections -->
    </main>

    <footer class="docfoot">
      <ul>
        <li><a href="%BASE_URL%">Home</a></li>
        <li><a href="tel:{{outlet.kalyani.phoneTel}}">Call {{outlet.kalyani.phone}}</a></li>
        <li><a href="{{brand.instagram}}">Instagram</a></li>
        <li><a href="%BASE_URL%privacy/">Privacy</a></li>
      </ul>
      <p>© 2026 {{brand.name}} · FSSAI {{outlet.kalyani.fssai}}</p>
    </footer>

    <script type="module" src="../src/menu/spy.ts"></script>
  </body>
</html>
