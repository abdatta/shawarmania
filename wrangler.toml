# The receipt Worker, beside the site and outside its build.
#
# It intercepts `/bill*` and `/menu*` and nothing else; every other path falls
# through to GitHub Pages exactly as before. The Vite build does not see this directory,
# nothing here enters the Pages artifact, and `scripts/check-weight.mjs` does not
# measure it.
#
# **The service-role key is not here and must never be.** It is a Worker secret:
#
#   npx wrangler secret put OPS_SERVICE_ROLE_KEY
#
# Locally it comes from `.dev.vars`, which is gitignored. See `worker/README.md`.

name = "shawarmania-receipt"
main = "worker/src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Publishes to `<name>.<subdomain>.workers.dev` so the Worker can be deployed and
# tested for real *before* the zone moves to Cloudflare. That is the whole point
# of the ordering in docs/OPERATIONS.md: the apex route is the last step, not the
# first, so a mistake there is never the thing standing between you and a working
# receipt.
workers_dev = true

[observability]
enabled = true

# Public, so it lives in the config rather than in a secret.
[vars]
OPS_SUPABASE_URL = "https://iefcidjbfnmsiqithqbj.supabase.co"
# Where `/menu/` sends a customer: the outlet whose tables carry that QR code
# (change 13 `the-table-menu-reads-ops`). A 302, so it can change here freely.
DEFAULT_MENU_SLUG = "kalyani-cafe"

# The apex route, enabled after the owner moved the zone to Cloudflare on
# 2026-09-10. See the ops repo's docs/OPERATIONS.md for the runbook and rollback.
# `wrangler dev` and `workers.dev` remain available independently.
# The receipt, its PDF and its assets: `/bill?t=<token>` (ops #66, the token after
# a `?` so the link registers on DLT as the dynamic URL `https://shawarmania.in/bill?`)
# and everything under `/bill/`. `bill*` rather than an exact `bill` plus `bill/*`:
# a pattern with no wildcard does not match once the URL carries a query string,
# which is every receipt link. Found in production on 2026-10-02, when the exact
# route answered `/bill` and let `/bill?t=…` fall through to Pages. The site has no
# other page under `/bill`, and the Worker 404s anything it does not own.
[[routes]]
pattern = "shawarmania.in/bill*"
zone_name = "shawarmania.in"

# Each trading outlet's live table menu, read from ops (change 13). `menu*`
# rather than `menu/*` so `/menu` without its slash reaches the Worker too.
[[routes]]
pattern = "shawarmania.in/menu*"
zone_name = "shawarmania.in"
